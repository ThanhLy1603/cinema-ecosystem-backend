server:
  port: 8080

spring:
  application:
    name: cinema-ecosystem-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:cinema_ecosystem_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Thanhly12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

app:
  jwt:
    secret: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  cookie:
    secure: false
  google:
    client-id: ${GOOGLE_CLIENT_ID:115438259381-urao23pd5ef6utl2an4rekritsmcf7hl.apps.googleusercontent.com}
