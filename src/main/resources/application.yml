server:
  port: 8080

spring:
  application:
    name: cinema-ecosystem-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5431}/${DB_NAME:cinema_ecosystem_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:lynguyenthanh1603@gmail.com}
    password: ${MAIL_PASSWORD:tpoffkxvhbdkuqrn}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

app:
  receipt:
    directory: ${RECEIPT_DIR:../Receipt_Cinema}
  booking:
    late-booking-minutes: 30
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/result}
      payment-window-minutes: 15
      simulator-enabled: ${PAYMENT_SIMULATOR_ENABLED:false}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:115438259381-urao23pd5ef6utl2an4rekritsmcf7hl.apps.googleusercontent.com}
  mail:
    from: ${MAIL_FROM:CinemaSphere <lynguyenthanh1603@gmail.com>}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}