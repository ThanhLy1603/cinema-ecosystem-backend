spring:
  datasource:
    password: <mật khẩu PostgreSQL>
  mail:
    password: <App Password 16 ký tự của Gmail gửi mail, viết liền, tạo tại https://myaccount.google.com/apppasswords>

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - https://<tên-miền-ngrok>.ngrok-free.dev
  jwt:
    secret: <chuỗi ngẫu nhiên tối thiểu 32 byte, tạo bằng: openssl rand -hex 32>
  cookie:
    secure: false
  cloudinary:
    cloud-name: your-cloud-name
    api-key: your-api-key
    api-secret: your-api-secret
  payment:
    vnpay:
      tmn-code: <TmnCode của VNPay Sandbox, hoặc SIMULATOR khi dùng cổng giả lập>
      hash-secret: <HashSecret của VNPay Sandbox, hoặc chuỗi ngẫu nhiên tạo bằng: openssl rand -hex 24>
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      return-url: http://localhost:3000/payment/result
      simulator-enabled: false
