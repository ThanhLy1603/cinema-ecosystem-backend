spring:
  datasource:
    password: <mật khẩu PostgreSQL>
  mail:
    password: <App Password 16 ký tự của Gmail gửi mail, viết liền, tạo tại https://myaccount.google.com/apppasswords>

app:
  jwt:
    secret: <chuỗi ngẫu nhiên tối thiểu 32 byte, tạo bằng: openssl rand -hex 32>
  cookie:
    secure: false
  cloudinary:
    cloud-name: your-cloud-name
    api-key: your-api-key
    api-secret: your-api-secret
